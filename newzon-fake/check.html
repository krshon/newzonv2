<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEWZON — Truth Index</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background: radial-gradient(circle at top, #0f1115, #05060a);
    font-family: "Inter", "Segoe UI", sans-serif;
    color: #e5e7eb;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

/* ---- CARD ---- */
.container {
    width: 100%;
    max-width: 680px;
    background: rgba(12, 14, 20, 0.95);
    border-radius: 18px;
    padding: 36px;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 0 60px rgba(0,0,0,0.9);
}

/* ---- HEADER ---- */
h2 {
    text-align: center;
    font-size: 34px;
    letter-spacing: 2px;
    font-weight: 800;
    margin-bottom: 6px;
    color: #38bdf8;
}

.subtitle {
    text-align: center;
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 28px;
}

/* ---- TEXTAREA ---- */
textarea {
    width: 100%;
    height: 130px;
    background: #05060a;
    border-radius: 14px;
    padding: 16px;
    color: #e5e7eb;
    font-size: 15px;
    border: 1px solid rgba(255,255,255,0.08);
    outline: none;
    resize: none;
    transition: 0.3s ease;
}

textarea:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 2px rgba(56,189,248,0.15);
}

textarea::placeholder {
    color: #6b7280;
}

/* ---- BUTTON ---- */
button {
    width: 100%;
    margin-top: 18px;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s ease;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 18px rgba(56,189,248,0.6);
}

/* ---- RESULT ---- */
.result-box {
    margin-top: 28px;
    padding: 28px;
    background: rgba(6,8,12,0.9);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    display: none;
}

/* ---- LABEL ---- */
.label {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 20px;
}

/* ---- BAR ---- */
.bar-bg {
    width: 100%;
    height: 14px;
    background: #111827;
    border-radius: 20px;
    overflow: hidden;
}

.bar-fill {
    height: 14px;
    width: 0%;
    border-radius: 20px;
    transition: width 0.8s ease;
}

/* ---- SCORE ---- */
.score-text {
    margin-top: 16px;
    text-align: center;
    font-size: 26px;
    font-weight: 700;
}

.score-text span {
    color: #38bdf8;
}

/* ---- SOURCES ---- */
.sources-title {
    margin-top: 22px;
    font-size: 14px;
    color: #9ca3af;
}

.sources {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.sources span {
    padding: 7px 14px;
    background: #020617;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    font-size: 12px;
    color: #e5e7eb;
}

/* ---- FOOTNOTE ---- */
.note {
    margin-top: 18px;
    font-size: 11px;
    color: #6b7280;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">
    <h2>NEWZON</h2>
    <div class="subtitle">LIVE AI CREDIBILITY ANALYSIS</div>

    <textarea id="newsInput" placeholder="Paste headline or article text here..."></textarea>
    <button onclick="checkNews()">Analyze Credibility</button>

    <div class="result-box" id="resultBox">
        <div class="label" id="finalLabel">RESULT</div>

        <div class="bar-bg">
            <div class="bar-fill" id="truthBar"></div>
        </div>

        <div class="score-text">
            Truth Index: <span id="truthPercent">--%</span>
        </div>

        <div class="sources-title">Independent Sources</div>
        <div class="sources" id="sourcesList"></div>

        <div class="note">
            Live credibility score — may update as new information emerges
        </div>
    </div>
</div>

<script>
async function checkNews() {
    const text = document.getElementById("newsInput").value.trim();
    if (!text) return alert("Enter news text");

    const res = await fetch("http://localhost:8000/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
    });

    const data = await res.json();

    document.getElementById("resultBox").style.display = "block";

    const label = document.getElementById("finalLabel");
    label.innerText = data.final_label.replace(/_/g, " ");

    if (data.final_label === "VERIFIED_BY_SOURCES") label.style.color = "#22c55e";
    else if (data.final_label === "LIKELY_FAKE") label.style.color = "#ef4444";
    else label.style.color = "#f59e0b";

    const bar = document.getElementById("truthBar");
    bar.style.width = data.truth_percent + "%";

    if (data.truth_percent >= 70) bar.style.background = "#22c55e";
    else if (data.truth_percent >= 40) bar.style.background = "#f59e0b";
    else bar.style.background = "#ef4444";

    document.getElementById("truthPercent").innerText = data.truth_percent + "%";

    const src = document.getElementById("sourcesList");
    src.innerHTML = "";
    data.sources.forEach(s => src.innerHTML += `<span>${s}</span>`);
}
</script>

</body>
</html>
